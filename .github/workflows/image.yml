name: Versie-image publiceren
# Tags v* → versie-image (met het automatische latest-gedrag van docker/metadata-action voor tags).
# Testbuilds (push naar een `ccr-*`- of `fase-*`-branch, of handmatig via workflow_dispatch) →
# tags `<versie>-rc` (versie uit teeltplanning/__init__.py), `branch-<naam>` en `sha-<korte commit>`;
# handmatig daarnaast `preview`. Een testbuild zet nooit `latest`.
on:
  push:
    tags: ['v*']
    branches: ['ccr-*', 'fase-*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Versie uit één bron lezen
        id: versie
        run: echo "versie=$(python3 -c "import re; print(re.search(r'__version__ = .([0-9][^\"\x27]*)', open('teeltplanning/__init__.py').read())[1])")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: '${{ github.actor }}'
          password: '${{ secrets.GITHUB_TOKEN }}'
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/') && 'auto' || 'false' }}
          tags: |
            type=ref,event=tag
            type=raw,value=preview,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=ref,event=branch,prefix=branch-
            type=sha,prefix=sha-,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.versie.outputs.versie }}-rc,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: '${{ steps.meta.outputs.tags }}'
          labels: '${{ steps.meta.outputs.labels }}'
