[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "teeltplanning"
# De versie heeft één bron: teeltplanning/__init__.py (__version__).
dynamic = ["version"]
description = "Zelf-gehoste teeltplanning voor chrysant (vervangt het werkboek Teeltprogramma maken)"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
include = ["teeltplanning*"]

[tool.setuptools.dynamic]
version = { attr = "teeltplanning.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
