{% extends "base.html" %}{% block titel %}Verificatiecode{% endblock %}
{% block inhoud %}
<h1>Verificatiecode</h1>
{% if fout %}<p class="melding fout">{{ fout }}</p>{% endif %}
<form method="post" action="/aanmelden/mfa" class="formulier">
  <input type="hidden" name="stap" value="{{ stap }}">
  <label>Code uit je authenticator-app <input name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="10" autofocus></label>
  <button type="submit">Bevestigen</button>
</form>
{% endblock %}
